<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"

  <body class="bg-gray-950">
    <header>
      <nav class="flex justify-between">
        <h1 class="ms-20 mt-3 text-3xl font-bold text-green-600 font-serif">
          D'Watch

        <ul class="flex justify-around gap-40 me-20 mt-3">
          <li class="font-medium underline underline-offset-1 text-white">
            <a href="">Product</a>
          </li>
          <li class="font-medium underline underline-offset-1 text-white">
            <a href="">About</a>
          </li>
          <li class="font-medium underline underline-offset-1 text-white">
            <a href="">Contact</a>
          </li>
          <li class="text-green-300">
            <i class="fa-solid fa-cart-shopping"></i>

        </ul>
      </nav>
    </header>
    <section class="flex justify-around">
      <div>

        <h3 class="text-white font-bold">Featured collectibiles</h3>
        <div class="flex justify-around gap-5 mt-3">
          <div class="w-40 h-70 bg-white rounded-xl">
            <img
              class="rounded-xl"
              src="https://img4.dhresource.com/webp/m/0x0/f3/albu/jc/n/13/c39f1504-ca57-4108-8981-7c51af74b20a.jpg"
              alt=""
            />

            <h4 class="text-center">$160</h4>
            <button
              class="bg-green-600 p-3 ps-5 text-center ms-7 mt-1 rounded-xl"
            >
              Buy now
            </button>
          </div>
          <div class="w-40 h-70 bg-white rounded-xl">
            <img
              class="rounded-xl"
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWwsizdhGwQ92GkthghH-Vkm5KxuZ9FkBEvcl3QYkbRImEZyHHe1TZt_KYsbJu81qlHqs&usqp=CAU"
              alt=""
            />

            <h4 class="text-center">$166</h4>
            <button
              class="bg-green-600 p-3 ps-5 text-center ms-7 mt-1 rounded-xl"
            >
              Buy now
            </button>
          </div>
          <div class="w-40 h-70 bg-white rounded-xl">
            <img
              class="h-40 rounded-xl"
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRRj-q7HbCLKKy866WwcUJ63pNyo19fvr4wFZB_dJm9oM9utER9etLwIcQIdzXsLPdoDaM&usqp=CAU"
              alt=""
            />
            <h4 class="font-medium text-center">Sierra Large Dial</h4>
            <h4 class="text-center">$169</h4>
            <button
              class="bg-green-600 p-3 ps-5 text-center ms-7 mt-1 rounded-xl"
            >
              Buy now
            </button>
          </div>
        </div>
        <button
          class="bg-green-600 p-5 ps-12 pe-12 text-center ms-7 mt-7 rounded-xl"
        >
          EXPLORE
        </button>
      </div>
      <div class="mt-7 ">
        <div class="flex justify-between p-5 border border-white">
          <div >
            <h1 class="text-white font-bold text-2xl">Bremont star</h1>
            <h4 class="text-white">$147</h4>
          </div>
          <div>
            <button class="bg-green-600 p-3 ps-5 text-center ms-7 mt-1 rounded-xl">Buy now</button>
          </div>
        </div>
        <div ">
          <img class="w-100"
            src="https://rukminim2.flixcart.com/image/480/640/xif0q/watch/b/t/q/-original-imahfszxvhautmcu.jpeg?q=90"

</html>
